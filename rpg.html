<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life RPG — Alper</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1517; --card:#161f23; --card2:#1c272c; --line:#26333a;
    --ink:#e8eef0; --ink2:#9db0b7; --ink3:#5f7178;
    --gold:#e3b34c; --gold-dim:#6b5424; --teal:#41b394; --coral:#d97862;
    --r:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{
    font-family:'IBM Plex Sans',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; padding:20px 16px 60px; font-size:15px; line-height:1.5;
  }
  .wrap{max-width:620px; margin:0 auto;}
  .display{font-family:'Chakra Petch',monospace; letter-spacing:.02em;}

  header{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px;}
  h1{font-family:'Chakra Petch',monospace; font-size:22px; font-weight:600; letter-spacing:.04em;}
  h1 span{color:var(--gold);}
  .date{font-size:12px; color:var(--ink3); text-transform:uppercase; letter-spacing:.1em;}

  .hud{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0 24px;}
  .hud .cell{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 10px; text-align:center;}
  .hud .v{font-family:'Chakra Petch',monospace; font-size:22px; font-weight:600; color:var(--gold);}
  .hud .k{font-size:11px; color:var(--ink3); text-transform:uppercase; letter-spacing:.12em; margin-top:2px;}

  .sect{font-family:'Chakra Petch',monospace; font-size:12px; font-weight:600; color:var(--ink3);
    text-transform:uppercase; letter-spacing:.18em; margin:26px 0 10px; display:flex; align-items:center; gap:10px;}
  .sect::after{content:""; flex:1; height:1px; background:var(--line);}

  .quest{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); padding:13px 14px; margin-bottom:8px; cursor:pointer; user-select:none;
    transition:border-color .15s, background .15s;}
  .quest:hover{border-color:#37474f;}
  .quest:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .quest.done{background:var(--card2); border-color:var(--gold-dim);}
  .box{width:22px; height:22px; border:2px solid var(--ink3); border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--bg); transition:all .15s;}
  .quest.done .box{background:var(--gold); border-color:var(--gold);}
  .qbody{flex:1; min-width:0;}
  .qname{font-weight:500; font-size:14.5px;}
  .quest.done .qname{color:var(--ink2); text-decoration:line-through; text-decoration-color:var(--gold-dim);}
  .qsub{font-size:12px; color:var(--ink3); margin-top:1px;}
  .xp{font-family:'Chakra Petch',monospace; font-size:12px; font-weight:600; color:var(--gold);
    background:rgba(227,179,76,.1); border:1px solid var(--gold-dim); border-radius:20px; padding:3px 9px; flex-shrink:0;}
  .tag{font-size:10px; font-weight:500; letter-spacing:.08em; color:var(--teal); border:1px solid rgba(65,179,148,.35);
    border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:1px;}
  .tag.off{color:var(--ink3); border-color:var(--line);}

  .counter{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .counter button{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--card2);
    color:var(--ink); font-size:16px; cursor:pointer; line-height:1;}
  .counter button:hover{border-color:var(--gold-dim);}
  .counter button:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
  .counter .cv{font-family:'Chakra Petch',monospace; font-size:15px; font-weight:600; min-width:34px; text-align:center;}

  .stat{display:flex; align-items:center; gap:12px; padding:9px 2px;}
  .sname{font-family:'Chakra Petch',monospace; font-size:13px; font-weight:600; width:42px; color:var(--ink2);}
  .pips{display:flex; gap:4px; flex:1;}
  .pip{height:9px; flex:1; background:var(--card2); border:1px solid var(--line); border-radius:3px;}
  .pip.on{background:var(--teal); border-color:var(--teal);}
  .pip.gold{background:var(--gold); border-color:var(--gold);}
  .slvl{font-family:'Chakra Petch',monospace; font-size:13px; font-weight:600; width:70px; text-align:right; color:var(--ink3);}
  .slvl b{color:var(--ink); font-weight:600;}

  .foot{margin-top:28px; font-size:12px; color:var(--ink3); text-align:center;}
  .toast{position:sticky; bottom:12px; margin:20px auto 0; width:fit-content; max-width:100%;
    background:var(--gold); color:#1a1408; font-family:'Chakra Petch',monospace; font-weight:600; font-size:13px;
    padding:9px 18px; border-radius:24px; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none;}
  .toast.show{opacity:1; transform:none;}
  #loading{display:none; text-align:center; color:var(--ink3); padding:60px 0; font-family:'Chakra Petch',monospace;}
  #app{display:none;}

  #gate{min-height:80vh; display:flex; align-items:center; justify-content:center;}
  .gate-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:32px 28px;
    width:100%; max-width:320px; text-align:center;}
  .gate-title{font-family:'Chakra Petch',monospace; font-size:15px; font-weight:600; letter-spacing:.1em;
    color:var(--gold); margin-bottom:6px;}
  .gate-sub{font-size:12px; color:var(--ink3); margin-bottom:20px;}
  .gate-card input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-size:14px; padding:10px 12px; margin-bottom:12px;
    text-align:center;}
  .gate-card input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}
  .gate-card button{width:100%; background:var(--gold); color:#1a1408; border:none; border-radius:8px;
    font-family:'Chakra Petch',monospace; font-weight:600; font-size:13px; letter-spacing:.06em; padding:11px;
    cursor:pointer; text-transform:uppercase;}
  .gate-card button:hover{filter:brightness(1.08);}
  .gate-err{font-size:12px; color:var(--coral); margin-top:12px; display:none;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <div id="gate">
    <div class="gate-card">
      <div class="gate-title">RESTRICTED ACCESS</div>
      <div class="gate-sub">Enter password to load save file</div>
      <form id="gateForm" autocomplete="off">
        <input type="password" id="gatePass" placeholder="password" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Unlock</button>
      </form>
      <div class="gate-err" id="gateErr">wrong password</div>
    </div>
  </div>

  <div id="loading">LOADING SAVE FILE…</div>
  <div id="app">
    <header>
      <h1>ALPER <span id="ovr">LV 5.3</span></h1>
      <div class="date" id="today"></div>
    </header>
    <div class="date" id="gymnote" style="margin-bottom:4px;"></div>

    <div class="hud">
      <div class="cell"><div class="v" id="xpToday">0</div><div class="k">XP today</div></div>
      <div class="cell"><div class="v" id="xpWeek">0</div><div class="k">XP week</div></div>
      <div class="cell"><div class="v" id="streak">0</div><div class="k">Streak</div></div>
    </div>

    <div class="sect">Daily quests</div>
    <div id="daily"></div>

    <div class="sect">Weekly quests</div>
    <div id="weekly"></div>

    <div class="sect">Character stats</div>
    <div id="stats" style="background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px;"></div>

    <div class="foot" id="foot"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

const KEY_CACHE = 'life-rpg-key';

function b64ToBytes(b64){
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}
function bytesToB64(bytes){
  return btoa(String.fromCharCode(...new Uint8Array(bytes)));
}

async function deriveKeyFromPassword(password){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    true,
    ['decrypt']
  );
}

async function importCachedKey(rawB64){
  return crypto.subtle.importKey('raw', b64ToBytes(rawB64), { name:'AES-GCM' }, false, ['decrypt']);
}

async function decryptPayload(key){
  const iv = b64ToBytes(PAYLOAD.iv);
  const ciphertext = b64ToBytes(PAYLOAD.ciphertext);
  const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ciphertext);
  return new TextDecoder().decode(plainBuf);
}

function runDecryptedApp(source){
  const el = document.getElementById('loading');
  el.style.display = 'block';
  const script = document.createElement('script');
  script.textContent = source;
  document.body.appendChild(script);
}

async function initGate(){
  const gate = document.getElementById('gate');
  const gateErr = document.getElementById('gateErr');
  const gatePass = document.getElementById('gatePass');

  const cached = localStorage.getItem(KEY_CACHE);
  if(cached){
    try{
      const key = await importCachedKey(cached);
      const source = await decryptPayload(key);
      gate.style.display = 'none';
      runDecryptedApp(source);
      return;
    }catch(e){
      localStorage.removeItem(KEY_CACHE);
    }
  }

  gate.style.display = 'flex';
  gatePass.focus();
  document.getElementById('gateForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const password = gatePass.value;
    try{
      const key = await deriveKeyFromPassword(password);
      const source = await decryptPayload(key);
      const raw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(KEY_CACHE, bytesToB64(raw));
      gate.style.display = 'none';
      runDecryptedApp(source);
    }catch(err){
      gateErr.style.display = 'block';
      gatePass.value = '';
      gatePass.focus();
    }
  });
}

initGate();
</script>
